<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff" />
      <stop offset="100%" stop-color="#47bfff" />
    </linearGradient>
  </defs>

  <!-- Pins Left -->
  <rect x="2" y="16" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />
  <rect x="2" y="26" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />
  <rect x="2" y="36" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />
  <rect x="2" y="46" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />

  <!-- Pins Right -->
  <rect x="54" y="16" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />
  <rect x="54" y="26" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />
  <rect x="54" y="36" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />
  <rect x="54" y="46" width="8" height="4" rx="1.5" fill="url(#chipGrad)" />

  <!-- Pins Top -->
  <rect x="16" y="2" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />
  <rect x="26" y="2" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />
  <rect x="36" y="2" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />
  <rect x="46" y="2" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />

  <!-- Pins Bottom -->
  <rect x="16" y="54" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />
  <rect x="26" y="54" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />
  <rect x="36" y="54" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />
  <rect x="46" y="54" width="4" height="8" rx="1.5" fill="url(#chipGrad)" />

  <!-- Chip Body -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#111827" stroke="url(#chipGrad)" stroke-width="3" />
  
  <!-- Central Die -->
  <rect x="20" y="20" width="24" height="24" rx="4" fill="url(#chipGrad)" fill-opacity="0.15" />
  <rect x="22" y="22" width="20" height="20" rx="3" fill="none" stroke="url(#chipGrad)" stroke-width="1.5" />

  <!-- Circuit / Core lines (DAG Representation) -->
  <!-- Top Node -->
  <circle cx="32" cy="22" r="3" fill="#47bfff" />
  <!-- Bottom Left Node -->
  <circle cx="24" cy="38" r="3" fill="#863bff" />
  <!-- Bottom Right Node -->
  <circle cx="40" cy="38" r="3" fill="#863bff" />
  
  <!-- Connections -->
  <path d="M32 25 L24 35" stroke="#47bfff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M32 25 L40 35" stroke="#47bfff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M27 38 L37 38" stroke="#863bff" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>